<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VYRONOX Prompt Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#000;--panel:#0d0f14;--line:#1c2230;--text:#f4f6fa;--mute:#8d96a8;--blue:#1f6bff;--glow:#3d8bff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
h1,h2,h3,.logo{font-family:"Space Grotesk",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
section{padding:56px 0}
h2{font-size:clamp(1.6rem,5vw,2.3rem);margin-bottom:8px}
.sub{color:var(--mute);margin:0 0 26px;max-width:52ch}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:700;font-size:1.15rem;cursor:pointer;border:0;background:none;padding:0}
.logo b{color:var(--glow)}
nav{display:none;gap:22px}
nav button,.mnav button{background:none;border:0;color:var(--mute);cursor:pointer;padding:6px 0}
nav button:hover,.mnav button:hover{color:var(--text)}
.right{display:flex;gap:10px;align-items:center}
.btn{background:var(--blue);border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;transition:box-shadow .2s,transform .1s}
.btn:hover{box-shadow:0 0 22px rgba(61,139,255,.55)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--glow);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:.9rem}
.menu{display:inline-flex}
.mnav{display:flex;flex-direction:column;border-top:1px solid var(--line);padding:8px 18px 14px;align-items:flex-start}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.hero{padding:64px 0 48px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:520px;height:520px;right:-180px;top:-120px;background:radial-gradient(circle,rgba(31,107,255,.4),transparent 68%);pointer-events:none}
.hero h1{font-size:clamp(2.3rem,9vw,4.6rem);line-height:1.02;max-width:14ch}
.hero p{color:var(--mute);font-size:1.05rem;max-width:46ch;margin:18px 0 26px}
.search{display:flex;gap:8px;max-width:520px;position:relative}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
.search input:focus{border-color:var(--glow);outline:none}
.stats{display:flex;gap:28px;margin-top:30px;color:var(--mute);font-size:.9rem;flex-wrap:wrap}
.stats b{display:block;color:var(--text);font-family:"Space Grotesk",sans-serif;font-size:1.4rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:8px 15px;cursor:pointer;color:var(--mute)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:#27406e}
.art{height:150px;display:block;width:100%}
.cb{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb h3{font-size:1.05rem}
.cb p{margin:0;color:var(--mute);font-size:.92rem;flex:1}
.tag{font-size:.8rem;color:var(--glow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.price{font-family:"Space Grotesk",sans-serif;font-size:1.25rem;font-weight:700}
.acts{display:flex;gap:8px}
.bundle{border-color:#27406e;background:linear-gradient(160deg,#0a1226,var(--panel))}
.bundle ul,.plan ul{margin:6px 0;padding-left:18px;color:var(--mute);font-size:.93rem}
.plan{padding:22px;gap:10px}
.plan.hot{border-color:var(--blue);box-shadow:0 0 30px rgba(31,107,255,.25)}
.plan .price{font-size:2rem}
.empty{color:var(--mute);padding:30px;border:1px dashed var(--line);border-radius:14px;text-align:center}
.about{display:grid;gap:24px}
.about p{color:var(--mute);margin:0 0 12px}
form{display:grid;gap:12px;max-width:520px}
form input,form textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
form input:focus,form textarea:focus{border-color:var(--glow);outline:none}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mute);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--blue);padding:11px 18px;border-radius:10px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:85vh;overflow:auto;padding:20px}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line button{background:none;border:0;color:var(--mute);cursor:pointer}
@media(min-width:700px){nav{display:flex}.menu{display:none}.mnav{display:none}.grid.c2,.grid.c3,.grid.c4{grid-template-columns:repeat(2,1fr)}.about{grid-template-columns:1fr 1fr}.modal{align-items:center}.sheet{border-radius:16px}}
@media(min-width:980px){.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useMemo, useEffect } = React;
const html = htm.bind(React.createElement);

/* ---------- 1. SETTINGS (easy to edit) ---------- */
const STORE = { name: "VYRONOX", email: "hello@vyronox.example", rate: 280 /* 1 USD in PKR: update when needed */ };
let CUR = "USD";
const money = n => CUR === "USD" ? "$" + n : "Rs " + (Math.round(n * STORE.rate / 10) * 10).toLocaleString("en-US");

/* Payment hook: later, replace the body with Stripe / Razorpay / Gumroad checkout. */
function startCheckout(items, total) {
  console.log("Checkout placeholder", { items, total });
  return Promise.resolve({ ok: false, message: "Payments are not connected yet." });
}

/* ---------- 2. SAMPLE DATA ---------- */
const CATEGORIES = ["AI Photography", "Cinematic Portraits", "Fashion", "Business and Social Media"];
const HUES = { "AI Photography": [215, 260], "Cinematic Portraits": [200, 230], "Fashion": [235, 285], "Business and Social Media": [190, 215] };

const PRODUCTS = [
  /* AI Photography */
  { id: 1, title: "Golden Hour Landscape", cat: CATEGORIES[0], price: 3, desc: "Warm, wide mountain scenes with soft haze.", prompt: "Ultra-wide mountain valley at golden hour, low sun flaring through volumetric haze, layered ridgelines fading into warm mist, a winding river catching the light, 24mm lens, rich colour grading, shot on medium format, razor-sharp foreground, 8k --ar 16:9 --style raw" },
  { id: 2, title: "Macro Dew Details", cat: CATEGORIES[0], price: 2, desc: "Close-up nature shots with creamy bokeh.", prompt: "Macro photo of morning dew drops on a green leaf edge, each droplet reflecting the sunrise, shallow depth of field, creamy background bokeh, 100mm macro lens, soft backlight, hyper-detailed water texture, natural colours --ar 4:5" },
  { id: 3, title: "Neon Rain Street", cat: CATEGORIES[0], price: 4, desc: "Night city streets with reflective wet roads.", prompt: "Rainy night in a narrow city street, pink and electric blue neon signs reflecting on wet asphalt, lone figure holding a transparent umbrella, steam rising from a vent, 35mm lens, cinematic haze, ultra-realistic, high contrast --ar 3:2" },
  { id: 4, title: "Aerial Coastline", cat: CATEGORIES[0], price: 3, desc: "Drone-style shots of waves meeting cliffs.", prompt: "Top-down aerial drone photo of turquoise waves crashing against dark rocky cliffs, white foam patterns, a tiny boat in the corner, crisp midday light, saturated but natural colours, ultra-high resolution, travel magazine style --ar 16:9" },
  { id: 5, title: "Misty Forest Dawn", cat: CATEGORIES[0], price: 3, desc: "Calm woodland with light rays through fog.", prompt: "Misty pine forest at dawn, soft god rays cutting through fog, a narrow dirt path leading into the distance, dew on ferns, muted green and gold palette, 50mm lens, peaceful atmosphere, fine film grain --ar 4:5" },
  /* Cinematic Portraits */
  { id: 6, title: "Film Noir Portrait", cat: CATEGORIES[1], price: 4, desc: "High-contrast portrait with dramatic shadows.", prompt: "Black and white portrait of a man in a trench coat, hard side light casting venetian blind shadows across his face, cigarette smoke curling upward, 85mm f/1.4, deep blacks, visible film grain, 1940s detective movie framing --ar 4:5" },
  { id: 7, title: "Blue Hour Close-Up", cat: CATEGORIES[1], price: 5, desc: "Cool-toned portrait with a warm rim light.", prompt: "Cinematic close-up portrait of a woman at blue hour, cool teal shadows with a warm orange rim light on her cheek, wind moving her hair, anamorphic lens flare, 50mm, shallow depth of field, emotional gaze, movie still look --ar 2:3" },
  { id: 8, title: "Desert Wanderer", cat: CATEGORIES[1], price: 4, desc: "Epic character portrait in sweeping dunes.", prompt: "Lone wanderer in a flowing sand-coloured cloak walking across desert dunes, strong wind lifting the fabric, low sun behind him, long shadows, dust particles in the air, wide cinematic frame, epic scale, muted warm tones --ar 21:9" },
  { id: 9, title: "Studio Rembrandt Light", cat: CATEGORIES[1], price: 4, desc: "Classic painterly studio lighting on skin.", prompt: "Studio portrait with Rembrandt lighting, small triangle of light under the eye, dark textured backdrop, rich skin detail, subtle catchlights, 105mm lens, deep brown and gold palette, timeless fine-art look --ar 4:5" },
  { id: 10, title: "Rainy Window Mood", cat: CATEGORIES[1], price: 3, desc: "Quiet, emotional portrait behind glass.", prompt: "Portrait of a young woman looking out a rainy window, raindrops on the glass blurring city lights behind her, soft blue interior light, melancholic mood, 85mm shallow focus, cinematic colour grade, gentle film grain --ar 3:4" },
  /* Fashion */
  { id: 11, title: "Editorial Runway", cat: CATEGORIES[2], price: 5, desc: "Magazine-style runway looks with bold lighting.", prompt: "High-fashion runway model in a structured black wool coat with sharp shoulders, strong spotlight from above, motion blur on the hem, audience silhouettes in the dark, editorial photography, sharp focus on face and fabric --ar 2:3" },
  { id: 12, title: "Streetwear Lookbook", cat: CATEGORIES[2], price: 4, desc: "Urban outfits on clean studio backdrops.", prompt: "Streetwear lookbook photo, model in oversized charcoal jacket, cargo pants and white sneakers, seamless light grey backdrop, soft box lighting, full-body confident pose, fashion catalogue style, crisp fabric texture --ar 4:5" },
  { id: 13, title: "Minimal Jewellery Ad", cat: CATEGORIES[2], price: 4, desc: "Product-first jewellery shots for shops.", prompt: "Minimal silver ring on black velvet, one soft highlight along the band, tiny reflected sparkle in the stone, macro lens, extremely shallow depth of field, luxury advertising look, clean negative space for text --ar 1:1" },
  { id: 14, title: "90s Boutique Vintage", cat: CATEGORIES[2], price: 3, desc: "Nostalgic film-style fashion photos.", prompt: "1990s fashion photo, model in a retro denim jacket and floral dress, standing outside a small boutique, flash photography, slightly faded colours, soft film grain, candid pose, compact camera look --ar 4:5" },
  { id: 15, title: "Haute Couture Fabric", cat: CATEGORIES[2], price: 5, desc: "Flowing gowns with dramatic fabric motion.", prompt: "Haute couture gown in deep royal blue silk, fabric caught mid-air in a long sweeping wave, dark studio background, rim light tracing the folds, dramatic editorial pose, ultra-detailed texture, 70mm --ar 2:3" },
  /* Business and Social Media */
  { id: 16, title: "LinkedIn Headshot Pro", cat: CATEGORIES[3], price: 4, desc: "Clean, trustworthy business portraits.", prompt: "Professional headshot of a confident friendly person in a navy blazer, softly blurred modern office behind, soft window light, natural smile, sharp eyes, clean skin detail, 85mm lens, corporate profile photo --ar 4:5" },
  { id: 17, title: "Instagram Gradient Backdrops", cat: CATEGORIES[3], price: 2, desc: "Branded backgrounds for posts and stories.", prompt: "Abstract gradient background flowing from electric blue to deep black, subtle grain texture, smooth glowing curves, large empty space in the centre for text, modern brand design, high resolution --ar 4:5" },
  { id: 18, title: "Product Launch Stage", cat: CATEGORIES[3], price: 5, desc: "Hero scenes for new product announcements.", prompt: "Product displayed on a reflective black pedestal, blue rim lighting, floating glowing particles, glossy floor reflection, premium tech launch visual, centred composition, dark background, sharp edges --ar 16:9" },
  { id: 19, title: "Cafe Brand Story", cat: CATEGORIES[3], price: 3, desc: "Warm lifestyle photos for local businesses.", prompt: "Cosy coffee shop interior, barista pouring latte art, warm window light, wooden counter, steam rising from cups, lifestyle brand photography, shallow depth of field, inviting mood, space for caption --ar 4:5" },
  { id: 20, title: "Flat-Lay Workspace", cat: CATEGORIES[3], price: 3, desc: "Top-down desk scenes for creators.", prompt: "Top-down flat lay of a tidy desk with laptop, notebook, coffee cup and small plant, soft daylight, neutral beige and black palette, organised composition, clean shadows, social media content style --ar 1:1" }
];

const BUNDLES = [
  { id: 101, title: "AI Photography Pack", price: 9, save: "Save 25%", items: ["5 photography prompts", "Camera and lens cheat sheet", "Free updates"] },
  { id: 102, title: "Cinematic Portrait Pack", price: 12, save: "Save 30%", items: ["5 portrait prompts", "Lighting setup guide", "Free updates"] },
  { id: 103, title: "Fashion and Business Pack", price: 22, save: "Save 35%", items: ["10 fashion and business prompts", "Brand style guide", "Free updates"] }
];

const PLANS = [
  { id: 201, name: "Single Prompt", price: 3, per: "per prompt", feats: ["1 full prompt", "Commercial use", "Instant copy"] },
  { id: 202, name: "Category Bundle", price: 12, per: "per bundle", feats: ["5 prompts in one style", "Commercial use", "Free updates", "Priority support"], hot: true },
  { id: 203, name: "All Access", price: 39, per: "one-time", feats: ["All 20 prompts and bundles", "Future releases", "Commercial use", "Priority support"] }
];

/* ---------- 3. SMALL COMPONENTS ---------- */
function Art({ cat, id }) {
  const [a, b] = HUES[cat] || [215, 260];
  const g = "g" + id;
  return html`<svg className="art" viewBox="0 0 300 150" preserveAspectRatio="xMidYMid slice" role="img" aria-label=${cat + " preview art"}>
    <defs><linearGradient id=${g} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor=${"hsl(" + a + ",85%,18%)"}/><stop offset="1" stopColor=${"hsl(" + b + ",90%,8%)"}/></linearGradient></defs>
    <rect width="300" height="150" fill=${"url(#" + g + ")"}/>
    <circle cx=${60 + (id % 5) * 40} cy="70" r=${34 + (id % 3) * 10} fill="none" stroke="#3d8bff" strokeOpacity=".6" strokeWidth="1.5"/>
    <circle cx=${200 - (id % 4) * 20} cy="90" r="46" fill="#1f6bff" fillOpacity=".25"/>
    <path d=${"M0 " + (110 + (id % 4) * 6) + " Q 90 70 170 105 T 300 90 V150 H0Z"} fill="#000" fillOpacity=".55"/>
  </svg>`;
}

function Card({ p, onCopy, onAdd }) {
  return html`<article className="card">
    <${Art} cat=${p.cat} id=${p.id}/>
    <div className="cb">
      <span className="tag">${p.cat}</span>
      <h3>${p.title}</h3>
      <p>${p.desc}</p>
      <div className="row">
        <span className="price">${money(p.price)}</span>
        <div className="acts">
          <button className="btn ghost sm" onClick=${() => onCopy(p)}>Copy sample</button>
          <button className="btn sm" onClick=${() => onAdd(p)}>Add to cart</button>
        </div>
      </div>
    </div>
  </article>`;
}

/* ---------- 4. APP ---------- */
function App() {
  const [page, setPage] = useState("home");
  const [menu, setMenu] = useState(false);
  const [query, setQuery] = useState("");
  const [cat, setCat] = useState("All");
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [toast, setToast] = useState("");
  const [sent, setSent] = useState(false);
  const [cur, setCur] = useState("USD");
  CUR = cur;

  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(""), 2200); return () => clearTimeout(t); }, [toast]);

  const results = useMemo(() => {
    const q = query.trim().toLowerCase();
    return PRODUCTS.filter(p => (cat === "All" || p.cat === cat) && (!q || (p.title + p.desc + p.cat + p.prompt).toLowerCase().includes(q)));
  }, [query, cat]);

  const total = cart.reduce((s, i) => s + i.price, 0);

  function go(id) {
    setMenu(false);
    if (page !== "home") setPage("home");
    setTimeout(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth" }); else window.scrollTo(0, 0); }, 60);
  }
  function copyText(text) {
    const done = () => setToast("Copied to clipboard");
    const fallback = () => { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); done(); } catch (e) { setToast("Copy failed. Select the text manually."); } t.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  }
  const copySample = p => copyText(p.prompt.split(",").slice(0, 2).join(",") + " ... (full prompt after purchase)");
  const add = item => { if (cart.some(c => c.id === item.id)) return setToast("Already in your cart"); setCart([...cart, item]); setToast("Added to cart"); };
  async function pay() { const r = await startCheckout(cart, total); setToast(r.message); }
  function send(e) { e.preventDefault(); setSent(true); }

  const links = [["Shop", "shop"], ["Bundles", "bundles"], ["Pricing", "pricing"], ["About", "about"]];

  return html`<div>
    <header>
      <div className="wrap bar">
        <button className="logo" onClick=${() => { setPage("home"); window.scrollTo(0, 0); }}>VYRONOX<b>.</b></button>
        <nav aria-label="Main">
          ${links.map(([l, id]) => html`<button key=${id} onClick=${() => go(id)}>${l}</button>`)}
          <button onClick=${() => { setPage("contact"); setMenu(false); window.scrollTo(0, 0); }}>Contact</button>
        </nav>
        <div className="right">
          <button className="btn ghost sm" onClick=${() => setCur(cur === "USD" ? "PKR" : "USD")} aria-label="Switch currency">${cur}</button>
          <button className="btn ghost sm" onClick=${() => setCartOpen(true)} aria-label="Open cart">Cart (${cart.length})</button>
          <button className="btn ghost sm menu" onClick=${() => setMenu(!menu)} aria-expanded=${menu}>Menu</button>
        </div>
      </div>
      ${menu && html`<div className="mnav">
        ${links.map(([l, id]) => html`<button key=${id} onClick=${() => go(id)}>${l}</button>`)}
        <button onClick=${() => { setPage("contact"); setMenu(false); window.scrollTo(0, 0); }}>Contact</button>
      </div>`}
    </header>

    ${page === "contact" ? html`<main className="wrap" style=${{ padding: "56px 18px" }}>
      <h2>Contact us</h2>
      <p className="sub">Questions about a prompt, a custom order or licensing? Send a message and we reply within one working day.</p>
      ${sent ? html`<div className="empty">Message sent. We will reply to you at the email you entered.</div>` : html`<form onSubmit=${send}>
        <input required placeholder="Your name" aria-label="Your name"/>
        <input required type="email" placeholder="Email address" aria-label="Email address"/>
        <textarea required rows="5" placeholder="How can we help?" aria-label="Message"></textarea>
        <button className="btn" type="submit">Send message</button>
      </form>`}
      <p className="sub" style=${{ marginTop: 22 }}>Or email ${STORE.email}</p>
    </main>` : html`<main>
      <section className="hero"><div className="wrap">
        <h1>Prompts that make AI images look expensive.</h1>
        <p>Tested prompts for photography, portraits, fashion and brand content. Copy, paste, and get studio-grade results in minutes.</p>
        <div className="search" role="search">
          <input value=${query} onChange=${e => { setQuery(e.target.value); }} placeholder="Search prompts, e.g. portrait" aria-label="Search prompts"/>
          <button className="btn" onClick=${() => go("shop")}>Search</button>
        </div>
        <div className="stats"><div><b>${PRODUCTS.length}+</b>premium prompts</div><div><b>${BUNDLES.length}</b>bundles</div><div><b>Instant</b>copy and use</div></div>
      </div></section>

      <section id="categories"><div className="wrap">
        <h2>Browse by category</h2>
        <p className="sub">Pick a style and jump straight to matching prompts.</p>
        <div className="grid c4">
          ${CATEGORIES.map(c => html`<button key=${c} className="card" style=${{ cursor: "pointer", textAlign: "left", color: "inherit" }} onClick=${() => { setCat(c); go("shop"); }}>
            <${Art} cat=${c} id=${c.length}/>
            <div className="cb"><h3>${c}</h3><span className="tag">${PRODUCTS.filter(p => p.cat === c).length} prompts</span></div>
          </button>`)}
        </div>
      </div></section>

      <section id="shop"><div className="wrap">
        <h2>Prompt library</h2>
        <p className="sub">Each prompt includes settings and aspect ratio. Copy a free sample, then unlock the full prompt.</p>
        <div className="search" style=${{ marginBottom: 16 }}>
          <input value=${query} onChange=${e => setQuery(e.target.value)} placeholder="Search prompts" aria-label="Search prompts in library"/>
        </div>
        <div className="chips">
          ${["All", ...CATEGORIES].map(c => html`<button key=${c} className=${"chip" + (cat === c ? " on" : "")} onClick=${() => setCat(c)}>${c}</button>`)}
        </div>
        ${results.length ? html`<div className="grid c3">${results.map(p => html`<${Card} key=${p.id} p=${p} onCopy=${copySample} onAdd=${add}/>`)}</div>`
          : html`<div className="empty">No prompts match “${query}”. Try a shorter word or choose All.</div>`}
      </div></section>

      <section id="bundles"><div className="wrap">
        <h2>Featured bundles</h2>
        <p className="sub">Save more when you buy prompts grouped by goal.</p>
        <div className="grid c3">
          ${BUNDLES.map(b => html`<article key=${b.id} className="card bundle plan">
            <span className="tag">${b.save}</span>
            <h3>${b.title}</h3>
            <ul>${b.items.map(i => html`<li key=${i}>${i}</li>`)}</ul>
            <div className="row"><span className="price">${money(b.price)}</span><button className="btn sm" onClick=${() => add(b)}>Add bundle</button></div>
          </article>`)}
        </div>
      </div></section>

      <section id="pricing"><div className="wrap">
        <h2>Simple pricing</h2>
        <p className="sub">One-time payments. No subscriptions, no hidden fees.</p>
        <div className="grid c3">
          ${PLANS.map(p => html`<article key=${p.id} className=${"card plan" + (p.hot ? " hot" : "")}>
            <h3>${p.name}</h3>
            <div><span className="price">${money(p.price)}</span> <span className="sub" style=${{ margin: 0 }}>${p.per}</span></div>
            <ul>${p.feats.map(f => html`<li key=${f}>${f}</li>`)}</ul>
            <button className=${"btn" + (p.hot ? "" : " ghost")} onClick=${() => add(p)}>Choose ${p.name}</button>
          </article>`)}
        </div>
      </div></section>

      <section id="about"><div className="wrap about">
        <div><h2>About VYRONOX</h2><p className="sub">We write prompts for people who care how their images look.</p></div>
        <div>
          <p>VYRONOX started as a personal collection of prompts that kept producing clean, usable images. Every prompt in the store is tested across several outputs before it is listed.</p>
          <p>You get a clear prompt, the settings that matter, and a commercial-use licence. New prompts are added every week.</p>
          <button className="btn" onClick=${() => { setPage("contact"); window.scrollTo(0, 0); }}>Talk to us</button>
        </div>
      </div></section>
    </main>`}

    <footer><div className="wrap">© 2026 VYRONOX Prompt Store. Prompts are digital products and delivered instantly.</div></footer>

    ${cartOpen && html`<div className="modal" onClick=${() => setCartOpen(false)}>
      <div className="sheet" onClick=${e => e.stopPropagation()} role="dialog" aria-label="Cart">
        <h3 style=${{ marginBottom: 10 }}>Your cart</h3>
        ${cart.length === 0 ? html`<div className="empty">Your cart is empty. Add a prompt or bundle to begin.</div>` : html`<div>
          ${cart.map(i => html`<div className="line" key=${i.id}><span>${i.title || i.name}</span><span>${money(i.price)} <button onClick=${() => setCart(cart.filter(c => c.id !== i.id))}>Remove</button></span></div>`)}
          <div className="line"><b>Total</b><b>${money(total)}</b></div>
          <div className="row" style=${{ marginTop: 14 }}><button className="btn ghost" onClick=${() => setCartOpen(false)}>Keep browsing</button><button className="btn" onClick=${pay}>Pay now</button></div>
        </div>`}
      </div>
    </div>`}
    ${toast && html`<div className="toast" role="status">${toast}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
